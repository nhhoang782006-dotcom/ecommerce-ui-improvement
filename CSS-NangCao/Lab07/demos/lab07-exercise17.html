<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Chapter 7</title>
    <link rel="stylesheet" href="lab07-exercise17.css" />

</head>
<body>

<main>
  <h2>CSS3 Filters</h2>
  <figure>
    <img alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>Original</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="saturate" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>saturate(3)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="grayscale" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>grayscale(100%)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="contrast" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>contrast(160%)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="brightness" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>brightness(30%)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="blur" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>blur(3px)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="invert" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>invert(100%)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="sepia" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>sepia(100%)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="huerotate" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>hue-rotate(90deg)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="filter-opacity" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>opacity(50%)</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="combo-1" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>Combo 1</figcaption>
  </figure>

  <figure>
    <img tabindex="0" class="combo-2" alt="Self Portrait in a Straw Hat" src="images/Lebrun.jpg">
    <figcaption>Combo 2</figcaption>
  </figure>


</main>
</body>
</html>
